# Meson cross file used to build the qboot (bios-microvm) firmware when the
# build host is not x86.  qboot.rom is shipped in the arch:all
# qemu-system-data package, so it has to be produced on every architecture.
# qboot itself adds "-m32 -march=i386" to the compile and link arguments, so
# the x86-64 cross toolchain emits the 32-bit code it needs.
[binaries]
c = 'x86_64-linux-gnu-gcc'
ar = 'x86_64-linux-gnu-ar'
strip = 'x86_64-linux-gnu-strip'
objcopy = 'x86_64-linux-gnu-objcopy'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
